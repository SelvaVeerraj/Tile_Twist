<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0c2a"/>
      <stop offset="1" stop-color="#2b1a5c"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3b0"/>
      <stop offset="0.5" stop-color="#ffb703"/>
      <stop offset="1" stop-color="#fb5607" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#space)"/>
  <g fill="#ffffff">
    <circle cx="80" cy="80" r="3"/><circle cx="200" cy="160" r="4"/><circle cx="330" cy="60" r="3"/><circle cx="600" cy="120" r="3"/>
    <circle cx="720" cy="40" r="4"/><circle cx="960" cy="200" r="3"/><circle cx="60" cy="400" r="4"/><circle cx="260" cy="520" r="3"/>
    <circle cx="940" cy="460" r="3"/><circle cx="820" cy="640" r="4"/><circle cx="120" cy="720" r="3"/><circle cx="380" cy="880" r="3"/>
    <circle cx="700" cy="900" r="4"/><circle cx="980" cy="960" r="3"/><circle cx="40" cy="960" r="4"/><circle cx="480" cy="300" r="2"/>
  </g>
  <!-- ringed planet -->
  <circle cx="820" cy="250" r="110" fill="#ff8fab"/>
  <path d="M720 230 q100 -40 200 0" stroke="#ffc2d1" stroke-width="18" fill="none"/>
  <path d="M730 290 q90 30 180 0" stroke="#e5708f" stroke-width="14" fill="none"/>
  <ellipse cx="820" cy="250" rx="190" ry="40" fill="none" stroke="#ffd166" stroke-width="14" transform="rotate(-18 820 250)"/>
  <!-- small planet -->
  <circle cx="170" cy="280" r="60" fill="#4cc9f0"/>
  <circle cx="150" cy="260" r="14" fill="#3aa6d0"/><circle cx="190" cy="300" r="10" fill="#3aa6d0"/>
  <!-- moon surface -->
  <path d="M0 860 Q260 790 520 840 T1024 820 L1024 1024 L0 1024 Z" fill="#9aa0b8"/>
  <g fill="#7d829b"><ellipse cx="160" cy="920" rx="60" ry="18"/><ellipse cx="460" cy="960" rx="80" ry="22"/><ellipse cx="820" cy="900" rx="56" ry="16"/><ellipse cx="660" cy="990" rx="40" ry="12"/></g>
  <!-- satellite -->
  <g transform="translate(250 600) rotate(-20)">
    <rect x="-20" y="-20" width="40" height="40" fill="#d0d7e2"/>
    <rect x="-100" y="-12" width="70" height="24" fill="#3a86ff"/><rect x="30" y="-12" width="70" height="24" fill="#3a86ff"/>
    <line x1="0" y1="-20" x2="0" y2="-50" stroke="#d0d7e2" stroke-width="4"/><circle cx="0" cy="-54" r="6" fill="#ff5c8a"/>
  </g>
  <!-- rocket -->
  <g transform="translate(540 520) rotate(25)">
    <path d="M-40 140 L-40 260 Q0 420 40 260 L40 140 Z" fill="url(#flame)"/>
    <path d="M-70 60 L-120 170 L-60 150 Z" fill="#e63946"/>
    <path d="M70 60 L120 170 L60 150 Z" fill="#e63946"/>
    <path d="M0 -260 Q90 -150 80 60 L70 160 L-70 160 L-80 60 Q-90 -150 0 -260 Z" fill="#f1f5f9"/>
    <path d="M0 -260 Q50 -200 64 -140 L-64 -140 Q-50 -200 0 -260 Z" fill="#e63946"/>
    <circle cx="0" cy="-60" r="40" fill="#3a86ff" stroke="#94a3b8" stroke-width="12"/>
    <circle cx="-12" cy="-72" r="12" fill="#bde0fe"/>
    <rect x="-70" y="60" width="140" height="22" fill="#94a3b8"/>
    <path d="M-10 70 L-10 200 L10 200 L10 70 Z" fill="#e63946"/>
  </g>
  <!-- comet -->
  <path d="M600 60 L420 200" stroke="#ffffff" stroke-width="6" opacity="0.5" stroke-linecap="round"/>
  <circle cx="600" cy="60" r="10" fill="#ffffff"/>
</svg>
