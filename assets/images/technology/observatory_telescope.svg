<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#03045e"/>
      <stop offset="1" stop-color="#7209b7"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#sky)"/>
  <!-- milky way band -->
  <path d="M0 400 q300 -200 600 -200 t424 -180 V180 q-200 100 -424 140 t-600 220 Z" fill="#ffffff" opacity="0.08"/>
  <!-- stars -->
  <g fill="#ffffff"><circle cx="80" cy="80" r="4"/><circle cx="200" cy="200" r="3"/><circle cx="340" cy="100" r="5"/><circle cx="470" cy="240" r="3"/><circle cx="600" cy="80" r="4"/><circle cx="760" cy="180" r="3"/><circle cx="920" cy="70" r="5"/><circle cx="980" cy="260" r="3"/><circle cx="140" cy="340" r="3"/><circle cx="880" cy="380" r="4"/><circle cx="420" cy="380" r="3"/></g>
  <!-- big star shapes -->
  <g fill="#ffd60a">
    <polygon points="700,300 710,326 738,326 716,342 724,368 700,352 676,368 684,342 662,326 690,326"/>
    <polygon points="260,260 266,276 284,276 270,286 275,302 260,292 245,302 250,286 236,276 254,276"/>
  </g>
  <!-- ringed planet -->
  <circle cx="860" cy="500" r="56" fill="#f4a261"/>
  <ellipse cx="860" cy="500" rx="110" ry="22" fill="none" stroke="#ffd166" stroke-width="10" transform="rotate(-20 860 500)"/>
  <!-- comet -->
  <path d="M120 520 q120 -40 260 -160" stroke="#90e0ef" stroke-width="10" fill="none" stroke-linecap="round" opacity="0.6"/>
  <circle cx="386" cy="356" r="14" fill="#caf0f8"/>
  <!-- hills -->
  <path d="M0 800 q260 -100 520 -60 t504 -40 V1024 H0 Z" fill="#240046"/>
  <path d="M0 880 q300 -60 600 -20 t424 -20 V1024 H0 Z" fill="#10002b"/>
  <!-- observatory building -->
  <rect x="320" y="620" width="300" height="200" fill="#e9ecef"/>
  <path d="M300 630 a170 170 0 0 1 340 0 Z" fill="#ced4da"/>
  <path d="M440 630 L470 466 L530 470 L520 630 Z" fill="#14213d"/>
  <rect x="440" y="720" width="60" height="100" rx="30" fill="#6c757d"/>
  <rect x="540" y="680" width="50" height="40" fill="#ffd166"/>
  <!-- telescope poking out -->
  <g transform="rotate(-35 490 560)">
    <rect x="460" y="380" width="60" height="220" rx="12" fill="#adb5bd"/>
    <rect x="452" y="360" width="76" height="40" rx="8" fill="#495057"/>
  </g>
  <!-- kid with small telescope -->
  <g transform="translate(780 820)">
    <line x1="-30" y1="0" x2="0" y2="-90" stroke="#6c757d" stroke-width="8"/>
    <line x1="30" y1="0" x2="0" y2="-90" stroke="#6c757d" stroke-width="8"/>
    <rect x="-40" y="-130" width="120" height="30" rx="10" fill="#ef476f" transform="rotate(-30 0 -110)"/>
    <rect x="-140" y="-80" width="44" height="80" rx="18" fill="#ffd166"/>
    <circle cx="-118" cy="-104" r="24" fill="#f4a261"/>
    <path d="M-142 -110 a24 22 0 0 1 48 0 Z" fill="#3d2914"/>
  </g>
</svg>
