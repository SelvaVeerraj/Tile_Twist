<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#240046"/>
      <stop offset="1" stop-color="#5a189a"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- neon grid floor -->
  <polygon points="0,760 1024,760 1024,1024 0,1024" fill="#10002b"/>
  <g stroke="#f72585" stroke-width="4" opacity="0.8">
    <line x1="0" y1="800" x2="1024" y2="800"/><line x1="0" y1="860" x2="1024" y2="860"/><line x1="0" y1="940" x2="1024" y2="940"/>
    <line x1="512" y1="760" x2="512" y2="1024"/><line x1="400" y1="760" x2="200" y2="1024"/><line x1="300" y1="760" x2="-100" y2="1024"/><line x1="624" y1="760" x2="824" y2="1024"/><line x1="724" y1="760" x2="1124" y2="1024"/>
  </g>
  <!-- neon wall signs -->
  <g fill="none" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <!-- neon star -->
    <polygon points="120,60 134,98 174,100 142,124 154,162 120,140 86,162 98,124 66,100 106,98" stroke="#4cc9f0"/>
    <!-- neon crescent moon -->
    <path d="M920 76 a50 50 0 1 0 10 88 a40 40 0 1 1 -10 -88 Z" stroke="#ffd60a"/>
    <!-- neon lightning bolt -->
    <polygon points="112,370 72,430 104,430 88,480 136,412 104,412" stroke="#80ffdb"/>
    <!-- neon heart -->
    <path d="M890 460 l-40 -40 a24 24 0 0 1 40 -28 a24 24 0 0 1 40 28 Z" stroke="#f72585"/>
  </g>
  <g fill="#ffffff"><circle cx="240" cy="80" r="3"/><circle cx="780" cy="260" r="3"/><circle cx="160" cy="600" r="3"/><circle cx="880" cy="620" r="3"/></g>
  <!-- cabinet -->
  <polygon points="300,120 724,120 724,900 300,900" fill="#3a86ff"/>
  <polygon points="724,120 800,160 800,900 724,900" fill="#265cba"/>
  <!-- marquee -->
  <rect x="320" y="140" width="384" height="100" rx="12" fill="#ffd60a"/>
  <g fill="#f72585"><rect x="350" y="170" width="36" height="40"/><rect x="400" y="170" width="36" height="40"/><rect x="450" y="170" width="36" height="40"/></g>
  <g fill="#3a0ca3"><circle cx="560" cy="190" r="24"/><circle cx="630" cy="190" r="24"/></g>
  <!-- screen -->
  <rect x="330" y="270" width="364" height="300" rx="16" fill="#111"/>
  <rect x="350" y="290" width="324" height="260" rx="10" fill="#03045e"/>
  <!-- space shooter game on screen (original art) -->
  <g fill="#ffffff"><circle cx="380" cy="310" r="3"/><circle cx="450" cy="350" r="2"/><circle cx="640" cy="320" r="3"/><circle cx="600" cy="400" r="2"/><circle cx="400" cy="460" r="2"/><circle cx="660" cy="500" r="3"/></g>
  <!-- planets to collect -->
  <circle cx="420" cy="350" r="22" fill="#f72585"/>
  <ellipse cx="420" cy="350" rx="36" ry="8" fill="none" stroke="#ffd60a" stroke-width="5"/>
  <circle cx="600" cy="340" r="18" fill="#06d6a0"/>
  <circle cx="520" cy="320" r="12" fill="#ff9e00"/>
  <!-- laser shots -->
  <g fill="#80ffdb"><rect x="508" y="400" width="8" height="26" rx="4"/><rect x="508" y="360" width="8" height="26" rx="4"/></g>
  <!-- player rocket -->
  <polygon points="512,440 540,510 512,498 484,510" fill="#4cc9f0"/>
  <circle cx="512" cy="472" r="8" fill="#ffffff"/>
  <polygon points="500,504 512,530 524,504" fill="#ff9e00"/>
  <!-- score bar -->
  <g fill="#ffd60a"><rect x="366" y="300" width="14" height="14"/><rect x="384" y="300" width="14" height="14"/><rect x="402" y="300" width="14" height="14"/></g>
  <!-- control panel -->
  <polygon points="300,600 724,600 760,700 264,700" fill="#4361ee"/>
  <circle cx="380" cy="650" r="30" fill="#22223b"/>
  <rect x="372" y="600" width="16" height="50" fill="#adb5bd"/>
  <circle cx="380" cy="596" r="24" fill="#ef233c"/>
  <g><circle cx="540" cy="650" r="22" fill="#ffd60a"/><circle cx="600" cy="640" r="22" fill="#06d6a0"/><circle cx="660" cy="650" r="22" fill="#f72585"/></g>
  <!-- coin slot -->
  <rect x="440" y="740" width="144" height="100" rx="8" fill="#265cba"/>
  <rect x="470" y="760" width="30" height="50" fill="#ffd60a"/><rect x="524" y="760" width="30" height="50" fill="#ffd60a"/>
  <g fill="#22223b"><rect x="481" y="770" width="8" height="30"/><rect x="535" y="770" width="8" height="30"/></g>
</svg>
