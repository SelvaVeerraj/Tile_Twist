<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb26b"/>
      <stop offset="0.5" stop-color="#ffd7a8"/>
      <stop offset="1" stop-color="#bfe3ff"/>
    </linearGradient>
    <path id="env" d="M0 -110 C70 -110 110 -60 110 -10 C110 50 50 90 25 120 L-25 120 C-50 90 -110 50 -110 -10 C-110 -60 -70 -110 0 -110 Z"/>
    <path id="gore" d="M0 -110 C38 -110 58 -60 58 -10 C58 50 26 90 12 120 L-12 120 C-26 90 -58 50 -58 -10 C-58 -60 -38 -110 0 -110 Z"/>
    <path id="mid" d="M0 -110 C12 -110 18 -60 18 -10 C18 50 8 90 4 120 L-4 120 C-8 90 -18 50 -18 -10 C-18 -60 -12 -110 0 -110 Z"/>
    <g id="basket">
      <line x1="-22" y1="120" x2="-16" y2="160" stroke="#5a3a1a" stroke-width="3"/>
      <line x1="22" y1="120" x2="16" y2="160" stroke="#5a3a1a" stroke-width="3"/>
      <rect x="-20" y="158" width="40" height="30" rx="4" fill="#8b5a2b"/>
      <line x1="-20" y1="170" x2="20" y2="170" stroke="#5a3a1a" stroke-width="3"/>
    </g>
  </defs>
  <rect width="1024" height="1024" fill="url(#sky)"/>
  <circle cx="512" cy="760" r="160" fill="#fff1c1" opacity="0.7"/>
  <ellipse cx="160" cy="300" rx="120" ry="34" fill="#ffffff" opacity="0.9"/>
  <ellipse cx="860" cy="460" rx="130" ry="36" fill="#ffffff" opacity="0.9"/>
  <ellipse cx="560" cy="120" rx="90" ry="26" fill="#ffffff" opacity="0.9"/>
  <!-- hills -->
  <path d="M0 800 Q200 700 420 780 T840 760 T1024 780 L1024 1024 L0 1024 Z" fill="#7bb661"/>
  <path d="M0 880 Q260 810 520 870 T1024 860 L1024 1024 L0 1024 Z" fill="#4f9a45"/>
  <path d="M0 960 Q300 920 640 950 T1024 950 L1024 1024 L0 1024 Z" fill="#3a7d35"/>
  <g fill="#2f6b2a"><circle cx="120" cy="860" r="30"/><circle cx="160" cy="870" r="22"/><circle cx="780" cy="850" r="34"/><circle cx="830" cy="862" r="24"/></g>
  <!-- big balloon -->
  <g transform="translate(330 360) scale(1.6)">
    <use xlink:href="#env" fill="#e63946"/><use xlink:href="#gore" fill="#ffd166"/><use xlink:href="#mid" fill="#e63946"/>
    <use xlink:href="#basket"/>
  </g>
  <!-- medium balloon -->
  <g transform="translate(720 260) scale(1.1)">
    <use xlink:href="#env" fill="#3a86ff"/><use xlink:href="#gore" fill="#ffffff"/><use xlink:href="#mid" fill="#3a86ff"/>
    <use xlink:href="#basket"/>
  </g>
  <!-- small balloons -->
  <g transform="translate(860 620) scale(0.7)">
    <use xlink:href="#env" fill="#8338ec"/><use xlink:href="#gore" fill="#ff006e"/><use xlink:href="#mid" fill="#8338ec"/>
    <use xlink:href="#basket"/>
  </g>
  <g transform="translate(140 620) scale(0.6)">
    <use xlink:href="#env" fill="#06d6a0"/><use xlink:href="#gore" fill="#ffd166"/><use xlink:href="#mid" fill="#06d6a0"/>
    <use xlink:href="#basket"/>
  </g>
  <g transform="translate(560 640) scale(0.45)">
    <use xlink:href="#env" fill="#fb8500"/><use xlink:href="#gore" fill="#ffffff"/><use xlink:href="#mid" fill="#fb8500"/>
    <use xlink:href="#basket"/>
  </g>
  <g stroke="#6b4f3a" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M520 220 q12 -10 24 0 q12 -10 24 0"/><path d="M60 140 q12 -10 24 0 q12 -10 24 0"/>
  </g>
</svg>
