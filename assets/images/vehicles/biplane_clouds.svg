<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a86ff"/>
      <stop offset="1" stop-color="#bde0fe"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#sky)"/>
  <circle cx="140" cy="140" r="80" fill="#ffd60a"/>
  <!-- cloud layers -->
  <g fill="#ffffff">
    <ellipse cx="800" cy="200" rx="160" ry="50"/><ellipse cx="860" cy="160" rx="90" ry="54"/><ellipse cx="740" cy="170" rx="70" ry="44"/>
    <ellipse cx="200" cy="420" rx="120" ry="40"/><ellipse cx="250" cy="390" rx="70" ry="40"/>
  </g>
  <path d="M0 820 q60 -80 140 -40 q40 -90 140 -50 q60 -80 160 -20 q60 -70 160 -10 q80 -70 170 0 q70 -50 140 10 q60 -30 114 10 V1024 H0 Z" fill="#ffffff"/>
  <path d="M0 900 q80 -60 160 -20 q60 -60 160 -10 q80 -60 180 0 q80 -50 180 0 q80 -40 180 0 q60 -30 164 10 V1024 H0 Z" fill="#e2eafc"/>
  <!-- smoke trail -->
  <g fill="#ffffff" opacity="0.9"><circle cx="160" cy="640" r="24"/><circle cx="100" cy="660" r="20"/><circle cx="50" cy="690" r="16"/><circle cx="220" cy="620" r="28"/></g>
  <path d="M60 690 q80 -40 180 -80" stroke="#ffffff" stroke-width="10" stroke-dasharray="6 18" fill="none" stroke-linecap="round"/>
  <!-- biplane -->
  <g transform="translate(560 520) rotate(-12)">
    <!-- lower wing -->
    <rect x="-240" y="40" width="480" height="44" rx="22" fill="#d62828"/>
    <!-- fuselage -->
    <path d="M-280 0 q0 -60 120 -60 h260 q80 0 120 40 v60 q-40 40 -120 40 h-260 q-120 0 -120 -80 Z" fill="#ef233c"/>
    <path d="M-280 0 l-60 -70 h50 l70 50 Z" fill="#d62828"/>
    <rect x="-340" y="-80" width="70" height="20" fill="#d62828"/>
    <!-- stripe -->
    <rect x="-200" y="-10" width="340" height="20" fill="#ffffff"/>
    <!-- cockpit & pilot -->
    <circle cx="-20" cy="-70" r="34" fill="#f4a261"/>
    <path d="M-54 -78 a34 30 0 0 1 68 0 Z" fill="#6f4518"/>
    <rect x="-46" y="-80" width="60" height="16" rx="8" fill="#48cae4"/>
    <path d="M4 -60 q40 -10 60 -40" stroke="#ffffff" stroke-width="10" fill="none" stroke-linecap="round"/>
    <!-- upper wing -->
    <rect x="-260" y="-160" width="520" height="44" rx="22" fill="#ffd60a"/>
    <g stroke="#6c757d" stroke-width="10"><line x1="-180" y1="-116" x2="-180" y2="40"/><line x1="180" y1="-116" x2="180" y2="40"/><line x1="-180" y1="-116" x2="180" y2="40"/></g>
    <!-- nose & propeller -->
    <circle cx="210" cy="10" r="36" fill="#495057"/>
    <ellipse cx="236" cy="10" rx="16" ry="130" fill="#adb5bd" opacity="0.8"/>
    <circle cx="236" cy="10" r="14" fill="#22223b"/>
    <!-- wheels -->
    <line x1="40" y1="84" x2="20" y2="140" stroke="#495057" stroke-width="10"/>
    <circle cx="20" cy="150" r="28" fill="#22223b"/><circle cx="20" cy="150" r="10" fill="#adb5bd"/>
  </g>
  <!-- birds -->
  <path d="M420 140 q16 -16 32 0 q16 -16 32 0 M500 200 q12 -12 24 0 q12 -12 24 0" stroke="#22223b" stroke-width="6" fill="none" stroke-linecap="round"/>
</svg>
