<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc8dd"/>
      <stop offset="1" stop-color="#fdf0d5"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#sky)"/>
  <!-- city backdrop -->
  <g fill="#cdb4db">
    <rect x="0" y="260" width="140" height="440"/><rect x="160" y="180" width="120" height="520"/><rect x="300" y="300" width="160" height="400"/>
    <rect x="600" y="220" width="130" height="480"/><rect x="750" y="320" width="120" height="380"/><rect x="890" y="200" width="134" height="500"/>
  </g>
  <g fill="#fdf0d5" opacity="0.8">
    <rect x="30" y="300" width="30" height="40"/><rect x="80" y="300" width="30" height="40"/><rect x="30" y="380" width="30" height="40"/><rect x="80" y="380" width="30" height="40"/>
    <rect x="190" y="220" width="26" height="36"/><rect x="236" y="220" width="26" height="36"/><rect x="190" y="300" width="26" height="36"/><rect x="236" y="300" width="26" height="36"/>
    <rect x="630" y="260" width="28" height="38"/><rect x="680" y="260" width="28" height="38"/><rect x="630" y="340" width="28" height="38"/>
    <rect x="920" y="240" width="30" height="40"/><rect x="970" y="240" width="30" height="40"/><rect x="920" y="320" width="30" height="40"/>
  </g>
  <!-- fire station -->
  <rect x="460" y="360" width="160" height="340" fill="#e63946"/>
  <polygon points="450,360 540,300 630,360" fill="#9d0208"/>
  <rect x="490" y="560" width="100" height="140" fill="#fefae0"/>
  <circle cx="540" cy="420" r="30" fill="#fefae0"/><path d="M540 400 v20 l14 10" stroke="#22223b" stroke-width="6" fill="none"/>
  <!-- street -->
  <rect y="700" width="1024" height="324" fill="#6c757d"/>
  <rect y="690" width="1024" height="20" fill="#adb5bd"/>
  <g fill="#fefae0"><rect x="40" y="960" width="120" height="14"/><rect x="300" y="960" width="120" height="14"/><rect x="560" y="960" width="120" height="14"/><rect x="820" y="960" width="120" height="14"/></g>
  <!-- truck body -->
  <rect x="100" y="620" width="600" height="220" rx="16" fill="#d62828"/>
  <path d="M700 640 h140 q60 0 80 60 l20 80 v60 h-240 Z" fill="#e63946"/>
  <path d="M720 660 h110 q30 0 44 40 l10 40 h-164 Z" fill="#caf0f8"/>
  <rect x="100" y="780" width="840" height="30" fill="#fefae0"/>
  <g fill="#fefae0"><rect x="140" y="660" width="120" height="90" rx="8"/><rect x="290" y="660" width="120" height="90" rx="8"/><rect x="440" y="660" width="120" height="90" rx="8"/></g>
  <g stroke="#adb5bd" stroke-width="6"><line x1="160" y1="680" x2="240" y2="680"/><line x1="160" y1="700" x2="240" y2="700"/><line x1="310" y1="680" x2="390" y2="680"/><line x1="460" y1="680" x2="540" y2="680"/></g>
  <!-- ladder -->
  <g transform="rotate(-18 120 600)">
    <rect x="120" y="570" width="640" height="16" fill="#adb5bd"/><rect x="120" y="614" width="640" height="16" fill="#adb5bd"/>
    <g fill="#adb5bd"><rect x="150" y="570" width="12" height="60"/><rect x="220" y="570" width="12" height="60"/><rect x="290" y="570" width="12" height="60"/><rect x="360" y="570" width="12" height="60"/><rect x="430" y="570" width="12" height="60"/><rect x="500" y="570" width="12" height="60"/><rect x="570" y="570" width="12" height="60"/><rect x="640" y="570" width="12" height="60"/><rect x="710" y="570" width="12" height="60"/></g>
  </g>
  <!-- siren lights -->
  <rect x="740" y="610" width="40" height="30" rx="8" fill="#118ab2"/><rect x="790" y="610" width="40" height="30" rx="8" fill="#ffd60a"/>
  <!-- wheels -->
  <g><circle cx="240" cy="850" r="70" fill="#22223b"/><circle cx="240" cy="850" r="30" fill="#adb5bd"/><circle cx="560" cy="850" r="70" fill="#22223b"/><circle cx="560" cy="850" r="30" fill="#adb5bd"/><circle cx="820" cy="850" r="70" fill="#22223b"/><circle cx="820" cy="850" r="30" fill="#adb5bd"/></g>
  <!-- hydrant -->
  <g transform="translate(960 640)"><rect x="-20" y="0" width="40" height="60" fill="#ffd60a"/><rect x="-30" y="16" width="60" height="16" fill="#ffd60a"/><path d="M-20 0 a20 20 0 0 1 40 0 Z" fill="#f77f00"/></g>
</svg>
