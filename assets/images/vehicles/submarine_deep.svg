  <g fill="#4cc9f0"><circle cx="110" cy="740" r="14"/><circle cx="96" cy="820" r="10"/></g>
  <g fill="#f72585"><circle cx="930" cy="844" r="14"/></g>
  <!-- jellyfish -->
  <g transform="translate(180 260)">
    <path d="M-70 0 a70 60 0 0 1 140 0 q-20 14 -35 0 q-17 14 -35 0 q-17 14 -35 0 q-17 14 -35 0 Z" fill="#f15bb5" opacity="0.9"/>
    <g stroke="#f15bb5" stroke-width="6" fill="none" opacity="0.8"><path d="M-50 6 q-10 50 10 100"/><path d="M-16 8 q10 60 -10 120"/><path d="M18 8 q-10 50 10 110"/><path d="M50 6 q14 50 -6 90"/></g>
  </g>
  <g transform="translate(880 200) scale(0.6)">
    <path d="M-70 0 a70 60 0 0 1 140 0 q-20 14 -35 0 q-17 14 -35 0 q-17 14 -35 0 q-17 14 -35 0 Z" fill="#9b5de5"/>
    <g stroke="#9b5de5" stroke-width="8" fill="none"><path d="M-40 6 q-10 50 10 100"/><path d="M0 8 q10 60 -10 120"/><path d="M40 6 q14 50 -6 90"/></g>
  </g>
  <!-- headlight beam -->
  <polygon points="760,520 1024,380 1024,700" fill="url(#beam)"/>
  <!-- submarine -->
  <ellipse cx="480" cy="540" rx="300" ry="130" fill="#ffd60a"/>
  <rect x="380" y="340" width="160" height="110" rx="30" fill="#ffc300"/>
  <rect x="460" y="270" width="16" height="80" fill="#6c757d"/><rect x="460" y="270" width="60" height="16" fill="#6c757d"/>
  <path d="M190 540 l-90 -90 v180 Z" fill="#f77f00"/>
  <rect x="80" y="520" width="60" height="40" fill="#495057"/>
  <g fill="#48cae4" stroke="#6c757d" stroke-width="12">
    <circle cx="380" cy="540" r="44"/><circle cx="500" cy="540" r="44"/><circle cx="620" cy="540" r="44"/>
  </g>
  <g fill="#ffffff" opacity="0.7"><circle cx="366" cy="526" r="12"/><circle cx="486" cy="526" r="12"/><circle cx="606" cy="526" r="12"/></g>
  <circle cx="770" cy="520" r="22" fill="#fff3b0"/>
  <rect x="300" y="640" width="360" height="20" rx="10" fill="#f77f00"/>
  <!-- bubbles -->
  <g fill="none" stroke="#caf0f8" stroke-width="5"><circle cx="70" cy="460" r="14"/><circle cx="50" cy="400" r="10"/><circle cx="76" cy="350" r="7"/><circle cx="500" cy="230" r="10"/><circle cx="520" cy="180" r="6"/></g>
  <!-- fish -->
