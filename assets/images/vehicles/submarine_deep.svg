<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0077b6"/>
      <stop offset="1" stop-color="#03045e"/>
    </linearGradient>
    <radialGradient id="beam" cx="0" cy="0.5" r="1">
      <stop offset="0" stop-color="#fff3b0" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#fff3b0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#sea)"/>
  <!-- seabed -->
  <path d="M0 880 q200 -60 400 -20 t624 -10 V1024 H0 Z" fill="#3a0ca3"/>
  <g fill="#480ca8"><ellipse cx="160" cy="900" rx="90" ry="40"/><ellipse cx="860" cy="920" rx="120" ry="46"/></g>
