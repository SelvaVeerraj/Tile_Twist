    <circle r="38" fill="#fff3b0"/>
  </g>
  <!-- flight path -->
  <path d="M260 760 q120 -40 80 -150 q-40 -90 60 -110" stroke="#6d4c41" stroke-width="8" stroke-dasharray="20 18" fill="none" stroke-linecap="round"/>
  <!-- wings -->
  <ellipse cx="430" cy="300" rx="120" ry="170" fill="#caf0f8" opacity="0.9" transform="rotate(-30 430 300)"/>
  <ellipse cx="640" cy="300" rx="120" ry="170" fill="#caf0f8" opacity="0.9" transform="rotate(30 640 300)"/>
