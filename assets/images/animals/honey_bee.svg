    <polygon points="150,92 210,92 240,144 210,196 150,196 120,144"/>
    <polygon points="60,144 120,144 150,196 120,248 60,248 30,196"/>
    <polygon points="870,760 930,760 960,812 930,864 870,864 840,812"/>
    <polygon points="780,812 840,812 870,864 840,916 780,916 750,864"/>
    <polygon points="870,864 930,864 960,916 930,968 870,968 840,916"/>
    <polygon points="960,812 1020,812 1050,864 1020,916 960,916 930,864"/>
  </g>
  <g fill="#ffd166"><polygon points="70,60 110,60 130,92 110,124 70,124 50,92"/><polygon points="880,780 920,780 940,812 920,844 880,844 860,812"/></g>
