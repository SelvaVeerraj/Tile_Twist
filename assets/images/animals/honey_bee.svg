  <circle cx="290" cy="490" r="30" fill="#22223b"/><circle cx="380" cy="490" r="30" fill="#22223b"/>
  <circle cx="300" cy="478" r="10" fill="#fff"/><circle cx="390" cy="478" r="10" fill="#fff"/>
  <path d="M290 570 q45 36 90 0" stroke="#22223b" stroke-width="10" fill="none" stroke-linecap="round"/>
  <circle cx="250" cy="560" r="20" fill="#ff8fab"/><circle cx="420" cy="560" r="20" fill="#ff8fab"/>
