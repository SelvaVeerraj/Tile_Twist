<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="pond" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0" stop-color="#48cae4"/>
      <stop offset="1" stop-color="#03045e"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#pond)"/>
  <!-- ripples -->
  <g fill="none" stroke="#90e0ef" stroke-width="5" opacity="0.6">
    <circle cx="200" cy="520" r="60"/><circle cx="200" cy="520" r="100"/>
    <circle cx="820" cy="460" r="50"/><circle cx="820" cy="460" r="90"/>
    <circle cx="560" cy="900" r="70"/>
  </g>
  <!-- lily pads -->
  <g fill="#52b788">
    <path d="M140 140 m-110 0 a110 110 0 1 0 220 0 a110 110 0 1 0 -220 0 Z M140 140 L250 120 L250 160 Z"/>
    <circle cx="880" cy="160" r="90"/>
    <circle cx="120" cy="880" r="100"/>
    <circle cx="900" cy="860" r="80"/>
  </g>
  <g fill="#2d6a4f"><polygon points="140,140 250,110 250,170"/><polygon points="880,160 790,120 790,200"/><polygon points="120,880 30,830 30,930"/><polygon points="900,860 980,820 980,900"/></g>
  <!-- lotus flower -->
  <g transform="translate(880 160)">
    <g fill="#ffafcc"><ellipse cx="0" cy="-40" rx="26" ry="50"/><ellipse cx="-40" cy="-20" rx="26" ry="50" transform="rotate(-45 -40 -20)"/><ellipse cx="40" cy="-20" rx="26" ry="50" transform="rotate(45 40 -20)"/></g>
    <circle cx="0" cy="0" r="18" fill="#ffd166"/>
  </g>
  <g transform="translate(120 880) scale(0.9)">
    <g fill="#ffffff"><ellipse cx="0" cy="-40" rx="26" ry="50"/><ellipse cx="-40" cy="-20" rx="26" ry="50" transform="rotate(-45 -40 -20)"/><ellipse cx="40" cy="-20" rx="26" ry="50" transform="rotate(45 40 -20)"/></g>
    <circle cx="0" cy="0" r="18" fill="#ffd166"/>
  </g>
  <!-- koi 1 (orange/white) -->
  <g transform="rotate(-25 480 380)">
    <ellipse cx="480" cy="380" rx="220" ry="90" fill="#ffffff"/>
    <ellipse cx="420" cy="360" rx="80" ry="50" fill="#f77f00"/>
    <ellipse cx="560" cy="400" rx="60" ry="40" fill="#f77f00"/>
    <path d="M690 380 l110 -90 q-30 90 0 180 Z" fill="#f77f00"/>
    <ellipse cx="460" cy="470" rx="60" ry="22" fill="#fcbf49" transform="rotate(30 460 470)"/>
    <ellipse cx="460" cy="290" rx="60" ry="22" fill="#fcbf49" transform="rotate(-30 460 290)"/>
    <circle cx="300" cy="360" r="12" fill="#1b263b"/>
  </g>
  <!-- koi 2 (red/black) -->
  <g transform="rotate(150 560 680)">
    <ellipse cx="560" cy="680" rx="200" ry="80" fill="#d62828"/>
    <ellipse cx="520" cy="660" rx="50" ry="34" fill="#1b263b"/>
    <ellipse cx="620" cy="700" rx="40" ry="26" fill="#ffffff"/>
    <path d="M750 680 l100 -80 q-26 80 0 160 Z" fill="#d62828"/>
    <circle cx="400" cy="660" r="11" fill="#1b263b"/>
  </g>
</svg>
