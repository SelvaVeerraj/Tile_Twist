<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffafcc"/>
      <stop offset="1" stop-color="#ffe5d9"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#90e0ef"/>
      <stop offset="1" stop-color="#0077b6"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#sky)"/>
  <circle cx="800" cy="220" r="110" fill="#ffd166"/>
  <!-- distant palms -->
  <path d="M120 600 q10 -160 -20 -280" stroke="#6d4c41" stroke-width="16" fill="none"/>
  <g fill="#2a9d8f">
    <path d="M100 320 q-90 -10 -120 50 q60 -40 120 -50 Z"/>
    <path d="M100 320 q90 -30 130 30 q-70 -30 -130 -30 Z"/>
    <path d="M100 320 q-40 -80 -110 -80 q70 20 110 80 Z"/>
    <path d="M100 320 q50 -80 120 -70 q-80 20 -120 70 Z"/>
  </g>
  <ellipse cx="512" cy="600" rx="700" ry="40" fill="#b5e48c"/>
  <rect y="600" width="1024" height="424" fill="url(#water)"/>
  <g stroke="#caf0f8" stroke-width="6" stroke-linecap="round" opacity="0.8">
    <line x1="80" y1="700" x2="200" y2="700"/><line x1="700" y1="680" x2="860" y2="680"/>
    <line x1="140" y1="900" x2="300" y2="900"/><line x1="760" y1="940" x2="920" y2="940"/>
  </g>
  <!-- reeds -->
  <g stroke="#55a630" stroke-width="10" stroke-linecap="round">
    <line x1="900" y1="760" x2="880" y2="540"/><line x1="940" y1="760" x2="950" y2="520"/><line x1="980" y1="760" x2="1000" y2="580"/>
  </g>
  <g fill="#7f4f24"><ellipse cx="880" cy="540" rx="12" ry="40"/><ellipse cx="950" cy="520" rx="12" ry="40"/></g>
  <!-- big flamingo -->
  <g>
    <line x1="470" y1="660" x2="470" y2="900" stroke="#f15bb5" stroke-width="14"/>
    <path d="M500 660 L520 790 L470 800" stroke="#f15bb5" stroke-width="14" fill="none" stroke-linejoin="round"/>
    <ellipse cx="480" cy="580" rx="170" ry="110" fill="#ff5d8f"/>
    <path d="M330 560 q60 -40 150 -10 q-60 70 -150 10 Z" fill="#ff87ab"/>
    <path d="M600 560 q40 -60 20 -180 q-20 -140 40 -200" stroke="#ff5d8f" stroke-width="44" fill="none" stroke-linecap="round"/>
    <circle cx="680" cy="170" r="54" fill="#ff5d8f"/>
    <circle cx="694" cy="156" r="10" fill="#1b263b"/>
    <path d="M720 170 q60 10 50 80 q-20 -30 -50 -40 Z" fill="#ffffff"/>
    <path d="M752 220 q20 20 18 30 q-12 -6 -26 -14 Z" fill="#1b263b"/>
  </g>
  <!-- small flamingo -->
  <g transform="translate(140 560) scale(0.55)">
    <line x1="470" y1="660" x2="470" y2="900" stroke="#f15bb5" stroke-width="14"/>
    <line x1="510" y1="660" x2="510" y2="900" stroke="#f15bb5" stroke-width="14"/>
    <ellipse cx="480" cy="580" rx="170" ry="110" fill="#ff87ab"/>
    <path d="M360 560 q-40 -60 -20 -180 q20 -140 -40 -200" stroke="#ff87ab" stroke-width="44" fill="none" stroke-linecap="round"/>
    <circle cx="290" cy="170" r="54" fill="#ff87ab"/>
    <path d="M250 170 q-60 10 -50 80 q20 -30 50 -40 Z" fill="#ffffff"/>
  </g>
</svg>
