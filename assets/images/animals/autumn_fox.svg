<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe8c2"/>
      <stop offset="1" stop-color="#f7b267"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <circle cx="512" cy="540" r="390" fill="#ffd59e"/>
  <!-- falling leaves -->
  <g>
    <path d="M110 140 q40 -50 80 0 q-40 50 -80 0 Z" fill="#e76f51" transform="rotate(-30 150 140)"/>
    <path d="M860 120 q40 -50 80 0 q-40 50 -80 0 Z" fill="#d62828" transform="rotate(25 900 120)"/>
    <path d="M80 820 q40 -50 80 0 q-40 50 -80 0 Z" fill="#f4a261" transform="rotate(40 120 820)"/>
    <path d="M880 860 q40 -50 80 0 q-40 50 -80 0 Z" fill="#e76f51" transform="rotate(-20 920 860)"/>
    <path d="M150 480 q30 -38 60 0 q-30 38 -60 0 Z" fill="#bc4b51" transform="rotate(60 180 480)"/>
    <path d="M840 480 q30 -38 60 0 q-30 38 -60 0 Z" fill="#f4a261" transform="rotate(-50 870 480)"/>
    <path d="M480 60 q30 -38 60 0 q-30 38 -60 0 Z" fill="#d62828" transform="rotate(10 510 60)"/>
    <path d="M500 960 q30 -38 60 0 q-30 38 -60 0 Z" fill="#e76f51"/>
  </g>
  <!-- ears -->
  <polygon points="250,180 420,330 300,440" fill="#e8590c"/>
  <polygon points="282,250 380,335 310,400" fill="#3b1f12"/>
  <polygon points="774,180 604,330 724,440" fill="#e8590c"/>
  <polygon points="742,250 644,335 714,400" fill="#3b1f12"/>
  <!-- head -->
  <polygon points="300,380 512,300 724,380 800,560 512,880 224,560" fill="#f76707"/>
  <polygon points="512,300 724,380 660,470 512,420" fill="#fd7e14"/>
  <polygon points="512,300 300,380 364,470 512,420" fill="#e8590c"/>
  <!-- white cheeks -->
  <polygon points="224,560 400,560 512,700 512,880" fill="#fff4e6"/>
  <polygon points="800,560 624,560 512,700 512,880" fill="#f1e3d3"/>
  <!-- eyes -->
  <ellipse cx="400" cy="520" rx="34" ry="40" fill="#2b1608"/>
  <ellipse cx="624" cy="520" rx="34" ry="40" fill="#2b1608"/>
  <circle cx="412" cy="506" r="11" fill="#ffffff"/>
  <circle cx="636" cy="506" r="11" fill="#ffffff"/>
  <!-- nose & mouth -->
  <path d="M470 760 L554 760 L512 815 Z" fill="#2b1608"/>
  <path d="M512 815 q-30 40 -60 20 M512 815 q30 40 60 20" stroke="#2b1608" stroke-width="7" fill="none" stroke-linecap="round"/>
  <!-- whisker dots -->
  <g fill="#c9a98a"><circle cx="440" cy="760" r="6"/><circle cx="420" cy="785" r="6"/><circle cx="584" cy="760" r="6"/><circle cx="604" cy="785" r="6"/></g>
  <!-- forehead marking -->
  <polygon points="512,420 560,470 512,600 464,470" fill="#ff922b"/>
  <!-- acorns -->
  <g transform="translate(140 640)">
    <ellipse cx="0" cy="20" rx="26" ry="32" fill="#b5651d"/>
    <path d="M-30 0 q30 -26 60 0 z" fill="#6b3e1e"/>
    <rect x="-3" y="-20" width="6" height="16" fill="#6b3e1e"/>
  </g>
  <g transform="translate(890 660) rotate(20)">
    <ellipse cx="0" cy="20" rx="26" ry="32" fill="#b5651d"/>
    <path d="M-30 0 q30 -26 60 0 z" fill="#6b3e1e"/>
    <rect x="-3" y="-20" width="6" height="16" fill="#6b3e1e"/>
  </g>
</svg>
