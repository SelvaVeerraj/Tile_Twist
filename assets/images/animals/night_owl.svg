<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1d51"/>
      <stop offset="1" stop-color="#3a3f8f"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#sky)"/>
  <circle cx="800" cy="220" r="130" fill="#fff4c2" opacity="0.25"/>
  <circle cx="800" cy="220" r="100" fill="#fff4c2"/>
  <circle cx="770" cy="200" r="16" fill="#efe0a0"/><circle cx="830" cy="250" r="22" fill="#efe0a0"/><circle cx="820" cy="180" r="10" fill="#efe0a0"/>
  <g fill="#ffffff">
    <circle cx="90" cy="90" r="4"/><circle cx="200" cy="200" r="3"/><circle cx="320" cy="80" r="5"/><circle cx="460" cy="160" r="3"/>
    <circle cx="560" cy="60" r="4"/><circle cx="640" cy="340" r="3"/><circle cx="950" cy="420" r="4"/><circle cx="120" cy="380" r="3"/>
    <circle cx="960" cy="80" r="3"/><circle cx="40" cy="560" r="4"/><circle cx="980" cy="620" r="3"/><circle cx="260" cy="440" r="3"/>
  </g>
  <!-- hills -->
  <path d="M0 860 Q260 780 520 850 T1024 830 L1024 1024 L0 1024 Z" fill="#14244f"/>
