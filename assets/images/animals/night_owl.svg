  <polygon points="350,360 330,250 430,340" fill="#6f4430"/>
  <polygon points="650,360 670,250 570,340" fill="#6f4430"/>
  <!-- eyes -->
  <circle cx="420" cy="440" r="80" fill="#f5e6c8"/>
  <circle cx="580" cy="440" r="80" fill="#f5e6c8"/>
  <circle cx="420" cy="440" r="54" fill="#ffb703"/>
  <circle cx="580" cy="440" r="54" fill="#ffb703"/>
  <circle cx="420" cy="440" r="30" fill="#111111"/>
  <circle cx="580" cy="440" r="30" fill="#111111"/>
  <circle cx="432" cy="428" r="10" fill="#ffffff"/>
  <circle cx="592" cy="428" r="10" fill="#ffffff"/>
  <polygon points="480,500 520,500 500,550" fill="#f4a261"/>
  <!-- feet -->
  <g fill="#f4a261"><ellipse cx="440" cy="770" rx="34" ry="14"/><ellipse cx="560" cy="770" rx="34" ry="14"/></g>
