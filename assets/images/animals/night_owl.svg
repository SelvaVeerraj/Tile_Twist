    <ellipse cx="820" cy="720" rx="44" ry="18" transform="rotate(20 820 720)"/>
    <ellipse cx="900" cy="690" rx="38" ry="15" transform="rotate(-30 900 690)"/>
    <ellipse cx="200" cy="780" rx="38" ry="15" transform="rotate(25 200 780)"/>
  </g>
  <!-- owl body -->
  <ellipse cx="500" cy="560" rx="200" ry="230" fill="#8d5b3f"/>
  <ellipse cx="500" cy="620" rx="130" ry="160" fill="#e9c9a1"/>
  <g fill="none" stroke="#b08860" stroke-width="6" stroke-linecap="round">
    <path d="M430 560 q20 18 40 0 M490 560 q20 18 40 0 M550 560 q20 18 40 0"/>
    <path d="M410 620 q20 18 40 0 M470 620 q20 18 40 0 M530 620 q20 18 40 0"/>
    <path d="M440 680 q20 18 40 0 M500 680 q20 18 40 0"/>
  </g>
  <!-- wings -->
  <path d="M300 520 q-60 140 20 280 q40 -120 30 -260 z" fill="#6f4430"/>
  <path d="M700 520 q60 140 -20 280 q-40 -120 -30 -260 z" fill="#6f4430"/>
