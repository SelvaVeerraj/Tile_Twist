  </g>
  <!-- hills and barn -->
  <path d="M0 560 Q200 440 420 520 T820 480 T1024 520 L1024 640 L0 640 Z" fill="#5aa83a"/>
  <rect x="640" y="440" width="110" height="80" fill="#c0392b"/>
  <polygon points="630,445 695,395 760,445" fill="#8e2b20"/>
  <rect x="680" y="470" width="30" height="50" fill="#f5e6c8"/>
  <line x1="680" y1="470" x2="710" y2="520" stroke="#c0392b" stroke-width="4"/>
  <line x1="710" y1="470" x2="680" y2="520" stroke="#c0392b" stroke-width="4"/>
  <circle cx="300" cy="490" r="34" fill="#2f7a23"/><rect x="295" y="500" width="10" height="40" fill="#5a3a1a"/>
  <rect y="600" width="1024" height="424" fill="url(#field)"/>
