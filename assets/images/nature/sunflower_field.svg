  <g fill="#3f8f2a">
    <ellipse cx="160" cy="830" rx="30" ry="12" transform="rotate(-30 160 830)"/>
    <ellipse cx="610" cy="840" rx="30" ry="12" transform="rotate(30 610 840)"/>
    <ellipse cx="270" cy="985" rx="44" ry="16" transform="rotate(-25 270 985)"/>
    <ellipse cx="770" cy="990" rx="44" ry="16" transform="rotate(25 770 990)"/>
  </g>
  <!-- bee -->
  <g transform="translate(700 560)">
    <ellipse rx="22" ry="14" fill="#ffd21a"/>
    <rect x="-6" y="-14" width="7" height="28" fill="#222"/><rect x="8" y="-12" width="6" height="24" fill="#222"/>
    <ellipse cx="-4" cy="-18" rx="12" ry="8" fill="#ffffff" opacity="0.85"/>
