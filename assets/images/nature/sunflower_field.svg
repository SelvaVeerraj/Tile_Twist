  <rect width="1024" height="600" fill="url(#sky)"/>
  <circle cx="830" cy="150" r="80" fill="#fff6b0"/>
  <circle cx="830" cy="150" r="60" fill="#ffe14d"/>
  <ellipse cx="220" cy="140" rx="100" ry="34" fill="#ffffff"/>
  <ellipse cx="270" cy="118" rx="64" ry="40" fill="#ffffff"/>
  <ellipse cx="560" cy="230" rx="80" ry="24" fill="#ffffff"/>
  <g stroke="#2b3a55" stroke-width="5" fill="none" stroke-linecap="round">
