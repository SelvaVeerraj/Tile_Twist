    <line x1="460" y1="635" x2="460" y2="700"/><line x1="590" y1="640" x2="590" y2="700"/><line x1="720" y1="632" x2="720" y2="700"/>
    <line x1="850" y1="645" x2="850" y2="700"/><line x1="970" y1="636" x2="970" y2="700"/>
  </g>
  <g stroke="#245a18" stroke-width="12">
    <line x1="140" y1="760" x2="140" y2="880"/><line x1="380" y1="750" x2="380" y2="880"/><line x1="630" y1="765" x2="630" y2="880"/>
    <line x1="880" y1="755" x2="880" y2="880"/>
  </g>
  <g stroke="#1d4a12" stroke-width="18">
