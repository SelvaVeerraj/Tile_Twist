  <use xlink:href="#sf" transform="translate(80 630) scale(0.55)"/>
  <use xlink:href="#sf" transform="translate(200 620) scale(0.55)"/>
  <use xlink:href="#sf" transform="translate(330 635) scale(0.55)"/>
  <use xlink:href="#sf" transform="translate(460 625) scale(0.55)"/>
  <use xlink:href="#sf" transform="translate(590 630) scale(0.55)"/>
  <use xlink:href="#sf" transform="translate(720 622) scale(0.55)"/>
  <use xlink:href="#sf" transform="translate(850 635) scale(0.55)"/>
  <use xlink:href="#sf" transform="translate(970 626) scale(0.55)"/>
  <use xlink:href="#sf" transform="translate(140 750) scale(1)"/>
  <use xlink:href="#sf" transform="translate(380 740) scale(1)"/>
  <use xlink:href="#sf" transform="translate(630 755) scale(1)"/>
  <use xlink:href="#sf" transform="translate(880 745) scale(1)"/>
  <use xlink:href="#sf" transform="translate(240 900) scale(1.7)"/>
  <use xlink:href="#sf" transform="translate(520 890) scale(1.7) rotate(15)"/>
  <use xlink:href="#sf" transform="translate(800 905) scale(1.7) rotate(-10)"/>
