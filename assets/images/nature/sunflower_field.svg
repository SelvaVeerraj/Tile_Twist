<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d9bf0"/>
      <stop offset="1" stop-color="#c4e8ff"/>
    </linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cc443"/>
      <stop offset="1" stop-color="#2f7a23"/>
    </linearGradient>
    <g id="sf">
      <g fill="#ffc21a">
        <ellipse cx="0" cy="-36" rx="12" ry="26"/>
        <ellipse cx="0" cy="-36" rx="12" ry="26" transform="rotate(30)"/>
        <ellipse cx="0" cy="-36" rx="12" ry="26" transform="rotate(60)"/>
        <ellipse cx="0" cy="-36" rx="12" ry="26" transform="rotate(90)"/>
        <ellipse cx="0" cy="-36" rx="12" ry="26" transform="rotate(120)"/>
        <ellipse cx="0" cy="-36" rx="12" ry="26" transform="rotate(150)"/>
        <ellipse cx="0" cy="-36" rx="12" ry="26" transform="rotate(180)"/>
        <ellipse cx="0" cy="-36" rx="12" ry="26" transform="rotate(210)"/>
        <ellipse cx="0" cy="-36" rx="12" ry="26" transform="rotate(240)"/>
        <ellipse cx="0" cy="-36" rx="12" ry="26" transform="rotate(270)"/>
        <ellipse cx="0" cy="-36" rx="12" ry="26" transform="rotate(300)"/>
        <ellipse cx="0" cy="-36" rx="12" ry="26" transform="rotate(330)"/>
      </g>
      <circle r="26" fill="#6b3e1e"/>
      <circle r="17" fill="#4a2812"/>
      <g fill="#8a5a2b"><circle cx="-8" cy="-6" r="3"/><circle cx="7" cy="-9" r="3"/><circle cx="0" cy="6" r="3"/><circle cx="10" cy="6" r="3"/><circle cx="-10" cy="8" r="3"/></g>
    </g>
