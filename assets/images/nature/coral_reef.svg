<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00b4d8"/>
      <stop offset="1" stop-color="#023e8a"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#sea)"/>
  <g fill="#ffffff" opacity="0.15"><ellipse cx="200" cy="40" rx="200" ry="30"/><ellipse cx="700" cy="60" rx="260" ry="30"/></g>
  <!-- sand -->
  <path d="M0 820 q200 -50 420 -10 t604 -30 V1024 H0 Z" fill="#ffe8a3"/>
  <!-- branch coral -->
  <path d="M180 900 v-200 M180 760 l-70 -90 M180 720 l80 -110 M110 670 l-30 -70 M260 610 l40 -60" stroke="#ff6b6b" stroke-width="30" fill="none" stroke-linecap="round"/>
  <path d="M820 900 v-240 M820 760 l90 -100 M820 720 l-80 -120 M910 660 l20 -80 M740 600 l-30 -60" stroke="#c77dff" stroke-width="30" fill="none" stroke-linecap="round"/>
  <!-- brain coral -->
  <ellipse cx="500" cy="880" rx="140" ry="90" fill="#ffb703"/>
  <path d="M390 870 q40 -40 80 0 t80 0 t80 0 M400 910 q40 -40 80 0 t80 0 t60 0" stroke="#fb8500" stroke-width="10" fill="none"/>
  <!-- anemone -->
  <g stroke="#ff8fab" stroke-width="18" stroke-linecap="round">
    <line x1="660" y1="930" x2="620" y2="840"/><line x1="680" y1="930" x2="670" y2="830"/><line x1="700" y1="930" x2="720" y2="836"/><line x1="720" y1="930" x2="770" y2="850"/>
  </g>
  <ellipse cx="690" cy="940" rx="70" ry="30" fill="#f15bb5"/>
  <!-- seaweed -->
  <path d="M320 1024 q-40 -100 10 -200 q40 -80 -10 -160" stroke="#2a9d8f" stroke-width="22" fill="none" stroke-linecap="round"/>
  <path d="M960 1024 q30 -90 -10 -180" stroke="#52b788" stroke-width="20" fill="none" stroke-linecap="round"/>
  <!-- clownfish -->
  <g transform="translate(520 420)">
    <ellipse rx="150" ry="90" fill="#ff7b00"/>
    <path d="M-60 -88 q30 88 0 176 l-40 -10 q24 -78 0 -156 Z" fill="#ffffff"/>
    <path d="M50 -84 q30 84 0 168 l-36 -8 q24 -76 0 -152 Z" fill="#ffffff"/>
    <path d="M140 0 l80 -70 q-20 70 0 140 Z" fill="#ff7b00"/>
    <path d="M-20 -88 q40 -50 90 -10 Z" fill="#ff9e00"/>
    <circle cx="-100" cy="-20" r="16" fill="#1b263b"/><circle cx="-104" cy="-24" r="5" fill="#fff"/>
  </g>
  <!-- blue tang -->
  <g transform="translate(220 230) scale(-0.7 0.7)">
    <ellipse rx="150" ry="90" fill="#4361ee"/>
    <path d="M-80 -40 q80 -40 160 20 q-80 0 -120 40 Z" fill="#1b263b"/>
    <path d="M140 0 l80 -70 q-20 70 0 140 Z" fill="#ffd60a"/>
    <circle cx="-100" cy="-20" r="16" fill="#1b263b"/>
  </g>
  <!-- small fish school -->
  <g fill="#ffd60a">
    <ellipse cx="820" cy="200" rx="30" ry="14"/><polygon points="846,200 866,186 866,214"/>
    <ellipse cx="880" cy="260" rx="30" ry="14"/><polygon points="906,260 926,246 926,274"/>
    <ellipse cx="800" cy="300" rx="30" ry="14"/><polygon points="826,300 846,286 846,314"/>
  </g>
  <g fill="none" stroke="#caf0f8" stroke-width="5"><circle cx="420" cy="300" r="12"/><circle cx="400" cy="250" r="8"/><circle cx="430" cy="210" r="6"/></g>
</svg>
