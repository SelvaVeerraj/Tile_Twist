  <path d="M0 680 q240 -120 500 -10 q240 100 524 -50 V1024 H0 Z" fill="#e76f51"/>
  <path d="M0 820 q300 -100 560 0 q240 80 464 -40 V1024 H0 Z" fill="#bc4749"/>
