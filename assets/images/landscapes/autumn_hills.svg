<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb4a2"/>
      <stop offset="1" stop-color="#fff3b0"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#sky)"/>
  <circle cx="512" cy="360" r="130" fill="#ffd166"/>
  <g fill="#ffffff" opacity="0.8"><ellipse cx="180" cy="160" rx="120" ry="36"/><ellipse cx="860" cy="120" rx="110" ry="32"/></g>
  <!-- rolling hills -->
