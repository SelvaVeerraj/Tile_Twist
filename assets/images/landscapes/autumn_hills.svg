    <rect x="146" y="620" width="16" height="60" fill="#6f4518"/><circle cx="154" cy="600" r="50" fill="#ffb703"/>
    <rect x="256" y="660" width="16" height="60" fill="#6f4518"/><circle cx="264" cy="640" r="44" fill="#d62828"/>
    <rect x="806" y="560" width="16" height="60" fill="#6f4518"/><circle cx="814" cy="540" r="50" fill="#fb8500"/>
    <rect x="896" y="600" width="16" height="60" fill="#6f4518"/><circle cx="904" cy="580" r="40" fill="#ffb703"/>
    <rect x="96" y="860" width="18" height="70" fill="#6f4518"/><circle cx="105" cy="830" r="60" fill="#fb8500"/>
    <rect x="860" y="860" width="18" height="70" fill="#6f4518"/><circle cx="869" cy="830" r="60" fill="#ffb703"/>
  </g>
  <!-- tall poplars -->
  <g fill="#ffd166"><ellipse cx="380" cy="480" rx="22" ry="70"/><ellipse cx="420" cy="490" rx="20" ry="60"/><ellipse cx="680" cy="420" rx="22" ry="70"/></g>
