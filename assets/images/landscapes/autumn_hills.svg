  <path d="M600 1024 q-200 -80 -60 -200 q140 -110 -20 -200 q-120 -70 20 -150" stroke="#fefae0" stroke-width="40" fill="none" stroke-linecap="round"/>
  <path d="M600 1024 q-200 -80 -60 -200 q140 -110 -20 -200 q-120 -70 20 -150" stroke="#e9c46a" stroke-width="6" stroke-dasharray="20 20" fill="none"/>
