  <!-- small red canoe -->
  <path d="M380 620 Q440 640 500 620 L490 632 Q440 646 390 632 Z" fill="#d94a2b"/>
  <line x1="440" y1="590" x2="452" y2="635" stroke="#5a3a1a" stroke-width="5"/>
