  <rect y="560" width="1024" height="464" fill="url(#lake)"/>
  <g opacity="0.35">
    <polygon points="430,560 600,950 660,890 720,980 820,870 900,930 1024,790 1024,560" fill="#c7cede"/>
    <polygon points="0,560 0,990 120,1060 230,1010 300,1050 420,980 560,840 700,700 760,560" fill="#0d3a1e"/>
