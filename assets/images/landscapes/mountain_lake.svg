  <ellipse cx="660" cy="900" rx="110" ry="22" fill="#ffffff" opacity="0.45"/>
  <ellipse cx="200" cy="980" rx="80" ry="14" fill="#ffffff" opacity="0.3"/>
  <g stroke="#ffffff" stroke-width="4" opacity="0.4" stroke-linecap="round">
    <line x1="120" y1="640" x2="260" y2="640"/><line x1="500" y1="700" x2="610" y2="700"/>
    <line x1="780" y1="660" x2="900" y2="660"/><line x1="320" y1="790" x2="420" y2="790"/>
    <line x1="820" y1="760" x2="960" y2="760"/>
