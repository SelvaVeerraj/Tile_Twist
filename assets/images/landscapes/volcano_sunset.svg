<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3c096c"/>
      <stop offset="0.5" stop-color="#d00000"/>
      <stop offset="1" stop-color="#ffba08"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#sky)"/>
  <!-- smoke -->
  <g fill="#5a189a" opacity="0.75">
    <circle cx="520" cy="230" r="80"/><circle cx="600" cy="170" r="90"/><circle cx="700" cy="120" r="100"/><circle cx="820" cy="90" r="90"/><circle cx="460" cy="160" r="60"/>
  </g>
  <!-- lava sparks -->
  <g fill="#ffba08"><circle cx="420" cy="260" r="12"/><circle cx="600" cy="280" r="10"/><circle cx="380" cy="320" r="8"/><circle cx="650" cy="340" r="9"/><circle cx="500" cy="200" r="7"/></g>
  <!-- volcano -->
  <polygon points="80,860 420,360 600,360 940,860" fill="#370617"/>
  <polygon points="420,360 600,360 640,420 380,420" fill="#6a040f"/>
  <!-- lava flows -->
  <path d="M480 360 q-30 120 -100 200 q-60 70 -80 200 l40 0 q20 -120 80 -180 q70 -90 90 -220 Z" fill="#f48c06"/>
  <path d="M560 360 q40 140 120 220 q40 60 50 180 l-30 0 q-20 -110 -60 -160 q-90 -100 -100 -240 Z" fill="#e85d04"/>
  <path d="M500 360 h40 q-10 60 -20 90 q-10 -30 -20 -90 Z" fill="#ffba08"/>
  <!-- glow at crater -->
  <ellipse cx="510" cy="360" rx="100" ry="24" fill="#ffba08"/>
  <!-- foreground hills & jungle -->
  <path d="M0 820 q200 -60 400 0 t624 -20 V1024 H0 Z" fill="#03071e"/>
  <g fill="#1b4332">
    <circle cx="80" cy="840" r="80"/><circle cx="200" cy="860" r="70"/><circle cx="880" cy="840" r="90"/><circle cx="980" cy="860" r="70"/><circle cx="760" cy="880" r="60"/>
  </g>
  <!-- palm silhouettes -->
  <path d="M140 1024 q10 -120 -30 -220" stroke="#03071e" stroke-width="18" fill="none"/>
  <g fill="#03071e">
    <path d="M110 800 q-80 -20 -130 30 q60 -30 130 -30 Z"/><path d="M110 800 q80 -40 130 20 q-70 -30 -130 -20 Z"/>
    <path d="M110 800 q-30 -70 -100 -80 q70 20 100 80 Z"/><path d="M110 800 q40 -80 110 -70 q-70 20 -110 70 Z"/>
  </g>
  <!-- lava river in foreground -->
  <path d="M300 1024 q60 -80 180 -100 q120 -20 160 -120 l20 0 q-40 120 -170 150 q-110 20 -160 70 Z" fill="#dc2f02"/>
  <!-- stars -->
  <g fill="#ffffff"><circle cx="80" cy="80" r="4"/><circle cx="200" cy="140" r="3"/><circle cx="300" cy="60" r="4"/><circle cx="960" cy="240" r="3"/><circle cx="100" cy="240" r="3"/></g>
</svg>
