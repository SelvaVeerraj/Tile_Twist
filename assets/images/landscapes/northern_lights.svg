<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#03045e"/>
      <stop offset="1" stop-color="#14213d"/>
    </linearGradient>
    <linearGradient id="aur1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#80ffdb" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#72efdd" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#06d6a0" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="aur2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c77dff" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#e0aaff" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#7b2cbf" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#sky)"/>
  <!-- stars -->
  <g fill="#ffffff"><circle cx="60" cy="60" r="4"/><circle cx="180" cy="120" r="3"/><circle cx="320" cy="50" r="5"/><circle cx="460" cy="110" r="3"/><circle cx="600" cy="40" r="4"/><circle cx="740" cy="90" r="3"/><circle cx="900" cy="60" r="5"/><circle cx="980" cy="160" r="3"/><circle cx="120" cy="260" r="3"/><circle cx="860" cy="280" r="4"/></g>
  <!-- aurora ribbons -->
  <path d="M0 160 q200 120 380 40 t360 60 t284 -40 V520 q-150 80 -300 0 t-360 20 t-364 -60 Z" fill="url(#aur1)"/>
  <path d="M0 300 q220 -80 440 40 t584 -20 V560 q-200 60 -420 -20 t-604 40 Z" fill="url(#aur2)"/>
  <path d="M100 200 q180 160 360 60 t420 80 V460 q-160 -20 -320 40 t-460 -60 Z" fill="#80ffdb" opacity="0.25"/>
  <!-- mountains -->
  <polygon points="0,700 160,480 300,620 460,420 640,660 800,500 1024,700 1024,1024 0,1024" fill="#1d3557"/>
  <polygon points="160,480 200,540 170,530 140,540 120,535" fill="#e0fbfc"/>
  <polygon points="460,420 510,490 470,480 440,500 410,490" fill="#e0fbfc"/>
  <polygon points="800,500 850,570 810,560 780,580 760,560" fill="#e0fbfc"/>
  <!-- frozen lake -->
  <rect y="760" width="1024" height="264" fill="#457b9d"/>
  <path d="M0 760 q200 40 400 0 t400 0 t224 10 V820 H0 Z" fill="#a8dadc" opacity="0.5"/>
  <g stroke="#72efdd" stroke-width="10" stroke-linecap="round" opacity="0.5"><line x1="100" y1="850" x2="300" y2="850"/><line x1="520" y1="900" x2="760" y2="900"/><line x1="200" y1="960" x2="400" y2="960"/></g>
  <!-- pine silhouettes -->
  <g fill="#0b132b">
    <polygon points="60,780 100,640 140,780"/><polygon points="120,790 170,600 220,790"/>
    <polygon points="840,780 890,620 940,780"/><polygon points="920,790 970,660 1020,790"/>
  </g>
  <!-- cabin -->
  <g transform="translate(600 690)">
    <rect x="0" y="40" width="160" height="90" fill="#6f4518"/>
    <polygon points="-20,50 80,-20 180,50" fill="#e0fbfc"/>
    <rect x="30" y="70" width="40" height="34" fill="#ffd166"/>
    <rect x="100" y="70" width="34" height="60" fill="#3d2914"/>
    <rect x="120" y="-10" width="20" height="40" fill="#3d2914"/>
  </g>
</svg>
